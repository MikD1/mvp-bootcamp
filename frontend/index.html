<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tasks</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container">
        <header>
            <h1>Tasks</h1>
            <p class="subtitle">Простейшее frontend-приложение</p>
        </header>

        <main>
            <section class="card">
                <h2>Список задач</h2>
                <form id="todo-form">
                    <input type="text" id="todo-input" placeholder="Новая задача..." autocomplete="off" />
                    <button type="submit">Добавить</button>
                </form>
                <ul id="todo-list"></ul>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
